<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Tracker</title>

<!-- Ionic CSS & JS -->
<link href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<ion-app>
  <ion-header>
    <ion-toolbar color="primary">
      <img src="icon.png" alt="Price History" slot="start" style="height:32px; margin-left:8px;">
      <ion-title>Price History</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">

    <!-- Dark Mode Toggle -->
    <ion-button expand="block" onclick="toggleDarkMode()">Toggle Dark / Light Mode</ion-button>

    <!-- Add Product -->
    <ion-card>
      <ion-card-header>
        <ion-card-title>Add Product</ion-card-title>
      </ion-card-header>
      <ion-card-content>
      <ion-item>
        <ion-icon name="cube-outline" slot="start"></ion-icon>
        <ion-input id="product" placeholder="Product"></ion-input>
      </ion-item>
      
      <ion-item>
        <ion-icon name="cash-outline" slot="start"></ion-icon>
        <ion-input id="price" type="number" placeholder="Price"></ion-input>
      </ion-item>
      
      <ion-item>
        <ion-icon name="storefront-outline" slot="start"></ion-icon>
        <ion-input id="store" placeholder="Store"></ion-input>
      </ion-item>
        <ion-button id="addBtn" expand="full" color="success" onclick="addRecord()">Add</ion-button>
      </ion-card-content>
    </ion-card>

    <!-- Search -->
    <ion-card>
      <ion-card-header>
        <ion-card-title>Search Product</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-searchbar id="search"></ion-searchbar>
        <ion-item>
          <ion-label>Filter by store</ion-label>
          <ion-select id="filterStore">
            <ion-select-option value="">All Stores</ion-select-option>
          </ion-select>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <!-- Dashboard -->
    <div id="dashboard"></div>

    <!-- Import / Export -->
    <ion-card>
      <ion-card-header>
        <ion-card-title>Import / Export CSV</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <input type="file" id="importCSV" accept=".csv">
        <ion-button expand="full" color="tertiary" onclick="exportCSV()">Export CSV</ion-button>
      </ion-card-content>
    </ion-card>

  </ion-content>
</ion-app>

<script type="module" src="firebase.js"></script>
<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
// 注意: search / filterStore 嘅 event listener 而家喺 app.js 入面統一綁定 (加咗 debounce)，
// 呢度唔再重複綁定，避免 double-fire。

window.toggleDarkMode = () => {
  document.body.classList.toggle('dark');
}
</script>

</body>
</html>
